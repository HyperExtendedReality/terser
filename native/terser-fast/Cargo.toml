[package]
name = "terser-fast"
version = "1.2.0"
edition = "2021"
description = "Optional native Rust hot-path hook accelerator for Terser"
license = "GPL-3.0-only"

[dependencies]
serde_json = "1"
sha2 = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
